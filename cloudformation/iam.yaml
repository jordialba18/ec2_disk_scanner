AWSTemplateFormatVersion: "2010-09-09"
Description: "YARA Scanner — IAM roles for Lambda, Step Functions, and scanner EC2"

Parameters:
  StackPrefix:
    Type: String
    Description: "Prefix for resource names (root stack name)"
  ResultsBucketArn:
    Type: String

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackPrefix}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: yara-scanner-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EC2Permissions
                Effect: Allow
                Action:
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumeStatus
                  - ec2:CreateSnapshot
                  - ec2:CreateVolume
                  - ec2:DeleteVolume
                  - ec2:DeleteSnapshot
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:CreateTags
                  - ec2:DescribeTags
                Resource: "*"
              - Sid: SSMPermissions
                Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:DescribeInstanceInformation
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: "*"
              - Sid: S3Permissions
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Ref ResultsBucketArn
                  - !Sub "${ResultsBucketArn}/*"
              - Sid: StepFunctionsPermissions
                Effect: Allow
                Action:
                  - states:StartExecution
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                Resource: "*"
              - Sid: LogsPermissions
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackPrefix}-sfn-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: yara-scanner-sfn-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeLambda
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: "*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
              - Sid: XRay
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

  ScannerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackPrefix}-ec2-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: yara-scanner-ec2-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Results
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub "${ResultsBucketArn}/scans/*"
                  - !Sub "${ResultsBucketArn}/scanner-image/*"
              - Sid: SSMTaskTokens
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: "*"
              - Sid: KMSEncryptedEBS
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                  - kms:CreateGrant
                  - kms:ReEncrypt*
                  - kms:DescribeKey
                Resource: "*"

  ScannerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${StackPrefix}-instance-profile"
      Roles:
        - !Ref ScannerInstanceRole

Outputs:
  LambdaRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LambdaRoleArn"

  SFNRoleArn:
    Value: !GetAtt StepFunctionsRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SFNRoleArn"

  ScannerInstanceProfileArn:
    Value: !GetAtt ScannerInstanceProfile.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ScannerInstanceProfileArn"

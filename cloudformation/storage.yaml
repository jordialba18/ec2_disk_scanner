AWSTemplateFormatVersion: "2010-09-09"
Description: "YARA Scanner — S3 results bucket and Secrets Manager GHCR credential stub"

Parameters:
  StackPrefix:
    Type: String
    Description: "Prefix for resource names (root stack name)"

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StackPrefix}-results-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-scan-results
            Status: Enabled
            Prefix: "scans/"
            ExpirationInDays: 90
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: ManagedBy
          Value: yara-scanner

  ResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonSSL
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ResultsBucket.Arn
              - !Sub "${ResultsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  GHCRSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${StackPrefix}/ghcr-credentials"
      Description: "GHCR credentials for pulling YARA scanner image."
      SecretString: '{"username":"REPLACE_ME","password":"REPLACE_ME"}'
      Tags:
        - Key: ManagedBy
          Value: yara-scanner

Outputs:
  ResultsBucketName:
    Value: !Ref ResultsBucket
    Export:
      Name: !Sub "${AWS::StackName}-ResultsBucketName"

  ResultsBucketArn:
    Value: !GetAtt ResultsBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ResultsBucketArn"

  GHCRSecretArn:
    Value: !Ref GHCRSecret
    Export:
      Name: !Sub "${AWS::StackName}-GHCRSecretArn"
